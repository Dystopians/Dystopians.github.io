<!-- 这几个库以前是全站每页无条件加载的：主页因此白下载 1.3 MB JS（plotly 1 MB + MathJax 251 KB），
     而实际上只有个别页面用得到。现在改成在页面 front matter 里按需开启：
       mathjax: true / plotly: true / mermaid: true
     （原来还挂着一个给 IE 用的 es6 polyfill，已删除。） -->
{% if page.mathjax %}
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
{% endif %}

{% if page.plotly %}
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@3.0.1/plotly.min.js"></script>
{% endif %}

{% if page.mermaid %}
  <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({startOnLoad:true, theme:'default'});
      await mermaid.run({querySelector:'code.language-mermaid'});
  </script>
{% endif %}

<!-- end custom footer snippets -->
