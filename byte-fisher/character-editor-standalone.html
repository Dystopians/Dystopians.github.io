<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byte Fisher 角色像素编辑器 | Character Pixel Art Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyber-dark: #0a0a0a;
      --cyber-bg: #1a1a1a;
      --cyber-panel: #2a2a2a;
      --cyber-border: #333;
      --cyber-cyan: #00f3ff;
      --cyber-green: #39ff14;
      --cyber-pink: #ff00ff;
      --cyber-yellow: #fdfd00;
      --cyber-purple: #9333ea;
      --text-primary: #fff;
      --text-secondary: #aaa;
      --text-muted: #666;
    }

    body {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background: linear-gradient(135deg, var(--cyber-dark) 0%, #0d1117 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      background: var(--cyber-panel);
      border: 2px solid var(--cyber-cyan);
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
    }

    .header h1 {
      font-size: 28px;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px var(--cyber-cyan);
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 20px;
      min-height: 700px;
    }

    .panel {
      background: var(--cyber-panel);
      border: 2px solid var(--cyber-border);
      padding: 15px;
      overflow-y: auto;
    }

    .panel-title {
      color: var(--cyber-cyan);
      font-size: 16px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--cyber-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Left Panel - Parts List */
    .parts-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .part-item {
      background: var(--cyber-bg);
      border: 1px solid var(--cyber-border);
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .part-item:hover {
      border-color: var(--cyber-green);
      background: rgba(57, 255, 20, 0.1);
    }

    .part-item.active {
      border-color: var(--cyber-cyan);
      background: rgba(0, 243, 255, 0.15);
    }

    .part-item.edited {
      border-left: 3px solid var(--cyber-green);
    }

    .part-info {
      flex: 1;
    }

    .part-name {
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .part-size {
      font-size: 11px;
      color: var(--text-muted);
    }

    .part-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      background: var(--cyber-green);
      color: var(--cyber-dark);
    }

    /* Center Panel - Canvas */
    .canvas-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .canvas-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px;
      background: var(--cyber-bg);
      border: 1px solid var(--cyber-border);
    }

    .toolbar-group {
      display: flex;
      gap: 5px;
      align-items: center;
      padding-right: 10px;
      border-right: 1px solid var(--cyber-border);
    }

    .toolbar-group:last-child {
      border-right: none;
    }

    .tool-btn {
      background: var(--cyber-panel);
      border: 1px solid var(--cyber-border);
      color: var(--text-secondary);
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: 13px;
    }

    .tool-btn:hover {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .tool-btn.active {
      background: var(--cyber-cyan);
      color: var(--cyber-dark);
      border-color: var(--cyber-cyan);
    }

    .tool-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cyber-bg);
      border: 2px solid var(--cyber-cyan);
      position: relative;
      min-height: 500px;
      overflow: auto;
    }

    .canvas-wrapper {
      display: inline-block;
      position: relative;
    }

    #pixelCanvas {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      cursor: crosshair;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    /* Right Panel - Tools */
    .color-palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--cyber-border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .color-swatch:hover {
      transform: scale(1.15);
      z-index: 10;
    }

    .color-swatch.active {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px var(--cyber-cyan);
    }

    .color-swatch.active::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 0 3px black, 0 0 3px black;
      font-weight: bold;
    }

    .custom-color-picker {
      width: 100%;
      height: 40px;
      border: 2px solid var(--cyber-border);
      cursor: pointer;
      margin-bottom: 15px;
    }

    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .layer-item {
      background: var(--cyber-bg);
      border: 1px solid var(--cyber-border);
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .layer-item.active {
      border-color: var(--cyber-cyan);
      background: rgba(0, 243, 255, 0.1);
    }

    .layer-preview {
      width: 30px;
      height: 30px;
      border: 1px solid var(--cyber-border);
      image-rendering: pixelated;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #2a2a2a 0% 50%) 50% / 8px 8px;
    }

    .layer-info {
      flex: 1;
      font-size: 12px;
    }

    .export-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .export-btn {
      background: var(--cyber-green);
      color: var(--cyber-dark);
      border: none;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
    }

    .export-btn:hover {
      background: var(--cyber-cyan);
      box-shadow: 0 0 15px var(--cyber-cyan);
    }

    .export-btn.secondary {
      background: var(--cyber-panel);
      color: var(--cyber-green);
      border: 1px solid var(--cyber-green);
    }

    .export-btn.secondary:hover {
      background: rgba(57, 255, 20, 0.1);
    }

    input[type="range"] {
      width: 100%;
      margin: 8px 0;
    }

    label {
      font-size: 12px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 4px;
    }

    .info-box {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyber-cyan);
      padding: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-top: 15px;
    }

    .animation-preview {
      background: var(--cyber-bg);
      border: 1px solid var(--cyber-border);
      padding: 15px;
      text-align: center;
    }

    .animation-canvas {
      image-rendering: pixelated;
      border: 1px solid var(--cyber-border);
      margin: 10px auto;
      display: block;
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .main-content {
        grid-template-columns: 220px 1fr 280px;
      }
    }

    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--cyber-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--cyber-border);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--cyber-cyan);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎨 BYTE FISHER 角色像素编辑器</h1>
      <p>专业的赛博朋克角色像素艺术创作工具 | Professional Cyberpunk Character Pixel Art Editor</p>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Panel: Parts List -->
      <div class="panel">
        <div class="panel-title">📦 部件列表 Parts</div>
        <div id="partsList" class="parts-list"></div>
      </div>

      <!-- Center Panel: Canvas -->
      <div class="panel canvas-panel">
        <div class="panel-title">🎨 画布 Canvas</div>

        <!-- Toolbar -->
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="tool-btn active" data-tool="pen" title="画笔">✏️ 笔</button>
            <button class="tool-btn" data-tool="eraser" title="橡皮擦">🧹 擦</button>
            <button class="tool-btn" data-tool="fill" title="填充">🪣 填</button>
            <button class="tool-btn" data-tool="picker" title="取色">💉 取</button>
          </div>

          <div class="toolbar-group">
            <button class="tool-btn" id="undoBtn" title="撤销">↶ 撤销</button>
            <button class="tool-btn" id="redoBtn" title="重做">↷ 重做</button>
          </div>

          <div class="toolbar-group">
            <button class="tool-btn" id="clearBtn" title="清空">🗑️ 清空</button>
            <button class="tool-btn" id="flipHBtn" title="水平翻转">↔️ 水平翻转</button>
            <button class="tool-btn" id="flipVBtn" title="垂直翻转">↕️ 垂直翻转</button>
          </div>

          <div class="toolbar-group">
            <label style="display: inline; margin: 0 5px;">缩放:</label>
            <input type="range" id="zoomSlider" min="4" max="32" value="8" step="1" style="width: 120px; margin: 0;">
            <span id="zoomValue">8x</span>
          </div>

          <div class="toolbar-group">
            <label style="display: inline; margin: 0 5px;">
              <input type="checkbox" id="gridToggle" checked>
              网格
            </label>
          </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container" id="canvasContainer">
          <div class="canvas-wrapper">
            <canvas id="pixelCanvas" width="640" height="640"></canvas>
          </div>
        </div>
      </div>

      <!-- Right Panel: Tools & Settings -->
      <div class="panel">
        <div class="panel-title">🎨 工具 Tools</div>

        <!-- Current Color -->
        <label>当前颜色 Current Color</label>
        <input type="color" id="customColorPicker" class="custom-color-picker" value="#39ff14">

        <!-- Color Palette -->
        <label>调色板 Palette</label>
        <div id="colorPalette" class="color-palette"></div>

        <!-- Layers -->
        <div class="panel-title" style="margin-top: 20px;">📚 图层 Layers</div>
        <div id="layerList" class="layer-list"></div>
        <button class="export-btn secondary" id="addLayerBtn">+ 新建图层</button>

        <!-- Animation Preview -->
        <div class="panel-title" style="margin-top: 20px;">🎬 预览 Preview</div>
        <div class="animation-preview">
          <canvas id="previewCanvas" class="animation-canvas" width="96" height="96"></canvas>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
            1:1 实际尺寸预览
          </div>
        </div>

        <!-- Export -->
        <div class="panel-title" style="margin-top: 20px;">💾 导出 Export</div>
        <div class="export-section">
          <button class="export-btn" id="exportPNGBtn">💾 导出当前部件 PNG</button>
          <button class="export-btn secondary" id="exportAllBtn">📦 导出全部部件 ZIP</button>
          <button class="export-btn secondary" id="importBtn">📂 导入图片</button>
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <!-- Info -->
        <div class="info-box">
          <strong>💡 快捷键</strong><br>
          Z - 撤销 | X - 重做<br>
          G - 切换网格<br>
          Space - 拖拽画布<br>
          [ ] - 缩小/放大笔刷<br>
          1-4 - 切换工具
        </div>
      </div>
    </div>
  </div>

  <script>
    // Character parts definition
    const PARTS = [
      { id: 'head', name: '头部 Head', width: 24, height: 24, category: 'base' },
      { id: 'torso', name: '躯干 Torso', width: 32, height: 40, category: 'base' },
      { id: 'torso_detail', name: '衬衫 Shirt', width: 16, height: 32, category: 'base' },
      { id: 'leg_upper', name: '大腿 Upper Leg', width: 12, height: 24, category: 'base' },
      { id: 'leg_lower', name: '小腿 Lower Leg', width: 12, height: 24, category: 'base' },
      { id: 'headgear_lv1', name: '帽子 Cap Lv1', width: 32, height: 8, category: 'gear' },
      { id: 'headgear_lv2', name: 'VR眼镜 VR Lv2', width: 28, height: 8, category: 'gear' },
      { id: 'headgear_lv3', name: '金色护目镜 Visor Lv3', width: 28, height: 8, category: 'gear' },
      { id: 'headgear_lv4', name: '赛博眼镜 Cyber Lv4', width: 28, height: 8, category: 'gear' },
      { id: 'headgear_lv5', name: '光环 Halo Lv5', width: 48, height: 32, category: 'gear' },
      { id: 'boots_lv1', name: '基础鞋 Basic Shoes Lv1', width: 32, height: 8, category: 'gear' },
      { id: 'boots_lv2', name: '重型靴 Heavy Boots Lv2', width: 32, height: 16, category: 'gear' },
      { id: 'boots_lv3', name: '活塞靴 Piston Boots Lv3', width: 48, height: 24, category: 'gear' },
      { id: 'boots_lv4', name: '喷射靴 Jet Boots Lv4', width: 48, height: 24, category: 'gear' },
      { id: 'boots_lv5', name: '反重力靴 Anti-Grav Lv5', width: 72, height: 24, category: 'gear' },
      { id: 'backpack_lv2', name: '背包 Backpack Lv2', width: 8, height: 24, category: 'gear' },
      { id: 'backpack_lv3', name: '天线 Antenna Lv3', width: 16, height: 64, category: 'gear' },
      { id: 'backpack_lv4', name: '卫星 Satellite Lv4', width: 24, height: 32, category: 'gear' },
      { id: 'backpack_lv5', name: '无人机 Drone Lv5', width: 16, height: 8, category: 'gear' }
    ];

    // Cyberpunk color palette
    const PALETTE = [
      '#050505', '#1a1a1a', '#333333', '#555555', '#777777', '#999999',
      '#bbbbbb', '#dddddd', '#ffffff', '#ff0000', '#ff6600', '#ff9900',
      '#ffcc00', '#ffff00', '#00ff00', '#00ffff', '#0099ff', '#0000ff',
      '#6600ff', '#9933ff', '#ff00ff', '#ff0099', '#39ff14', '#00f3ff',
      '#fdfd00', '#ffd700', '#ff00aa', '#00ffaa', '#ff6b9d', '#c0c0c0'
    ];

    // App state
    let currentPart = null;
    let currentTool = 'pen';
    let currentColor = '#39ff14';
    let zoom = 8;
    let showGrid = true;
    let layers = [{ name: 'Layer 1', data: null, visible: true }];
    let currentLayerIndex = 0;
    let history = [];
    let historyIndex = -1;
    let isDrawing = false;
    let lastX = -1;
    let lastY = -1;

    // Canvas references
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');

    // Initialize
    function init() {
      renderPartsList();
      renderColorPalette();
      renderLayerList();
      setupEventListeners();
      selectPart(PARTS[0]);
    }

    function renderPartsList() {
      const container = document.getElementById('partsList');
      container.innerHTML = PARTS.map(part => `
        <div class="part-item" data-part-id="${part.id}">
          <div class="part-info">
            <div class="part-name">${part.name}</div>
            <div class="part-size">${part.width}×${part.height}px</div>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.part-item').forEach(item => {
        item.addEventListener('click', () => {
          const partId = item.dataset.partId;
          const part = PARTS.find(p => p.id === partId);
          selectPart(part);
        });
      });
    }

    function renderColorPalette() {
      const container = document.getElementById('colorPalette');
      container.innerHTML = PALETTE.map(color => `
        <div class="color-swatch" style="background: ${color}" data-color="${color}"></div>
      `).join('');

      container.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', () => {
          currentColor = swatch.dataset.color;
          document.getElementById('customColorPicker').value = currentColor;
          updateColorSelection();
        });
      });

      updateColorSelection();
    }

    function updateColorSelection() {
      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.classList.toggle('active', swatch.dataset.color === currentColor);
      });
    }

    function renderLayerList() {
      const container = document.getElementById('layerList');
      container.innerHTML = layers.map((layer, index) => `
        <div class="layer-item ${index === currentLayerIndex ? 'active' : ''}" data-layer-index="${index}">
          <canvas class="layer-preview" width="30" height="30"></canvas>
          <div class="layer-info">${layer.name}</div>
        </div>
      `).join('');

      // Render layer previews
      container.querySelectorAll('.layer-item').forEach((item, index) => {
        const layerCanvas = item.querySelector('canvas');
        const layerCtx = layerCanvas.getContext('2d');
        if (layers[index].data) {
          layerCtx.putImageData(layers[index].data, 0, 0);
        }

        item.addEventListener('click', () => {
          currentLayerIndex = index;
          renderLayerList();
          render();
        });
      });
    }

    function selectPart(part) {
      if (currentPart && currentPart.id !== part.id) {
        // Save current part data to layer
        saveCurrentLayer();
      }

      currentPart = part;

      // Reset canvas size
      canvas.width = part.width * zoom;
      canvas.height = part.height * zoom;

      // Reset layers
      layers = [{ name: 'Layer 1', data: createEmptyImageData(), visible: true }];
      currentLayerIndex = 0;
      history = [];
      historyIndex = -1;

      // Update UI
      document.querySelectorAll('.part-item').forEach(item => {
        item.classList.toggle('active', item.dataset.partId === part.id);
      });

      renderLayerList();
      render();
      updatePreview();
    }

    function createEmptyImageData() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = currentPart.width;
      tempCanvas.height = currentPart.height;
      const tempCtx = tempCanvas.getContext('2d');
      return tempCtx.getImageData(0, 0, currentPart.width, currentPart.height);
    }

    function saveCurrentLayer() {
      const imageData = getScaledImageData();
      layers[currentLayerIndex].data = imageData;
    }

    function getScaledImageData() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = currentPart.width;
      tempCanvas.height = currentPart.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0, currentPart.width, currentPart.height);
      return tempCtx.getImageData(0, 0, currentPart.width, currentPart.height);
    }

    function render() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw checkerboard background
      const gridSize = zoom;
      for (let y = 0; y < canvas.height; y += gridSize) {
        for (let x = 0; x < canvas.width; x += gridSize) {
          ctx.fillStyle = ((x / gridSize + y / gridSize) % 2 === 0) ? '#1a1a1a' : '#2a2a2a';
          ctx.fillRect(x, y, gridSize, gridSize);
        }
      }

      // Draw layer content
      if (layers[currentLayerIndex].data) {
        ctx.imageSmoothingEnabled = false;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = currentPart.width;
        tempCanvas.height = currentPart.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.putImageData(layers[currentLayerIndex].data, 0, 0);
        ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
      }

      // Draw grid
      if (showGrid) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += zoom) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += zoom) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      updatePreview();
    }

    function updatePreview() {
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

      // Draw checkerboard
      for (let y = 0; y < previewCanvas.height; y += 8) {
        for (let x = 0; x < previewCanvas.width; x += 8) {
          previewCtx.fillStyle = ((x / 8 + y / 8) % 2 === 0) ? '#1a1a1a' : '#2a2a2a';
          previewCtx.fillRect(x, y, 8, 8);
        }
      }

      if (layers[currentLayerIndex].data) {
        previewCtx.imageSmoothingEnabled = false;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = currentPart.width;
        tempCanvas.height = currentPart.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.putImageData(layers[currentLayerIndex].data, 0, 0);

        const scale = Math.min(
          previewCanvas.width / currentPart.width,
          previewCanvas.height / currentPart.height
        );
        const offsetX = (previewCanvas.width - currentPart.width * scale) / 2;
        const offsetY = (previewCanvas.height - currentPart.height * scale) / 2;

        previewCtx.drawImage(
          tempCanvas,
          offsetX, offsetY,
          currentPart.width * scale,
          currentPart.height * scale
        );
      }
    }

    function drawPixel(x, y, color) {
      const pixelX = Math.floor(x / zoom);
      const pixelY = Math.floor(y / zoom);

      if (pixelX < 0 || pixelX >= currentPart.width || pixelY < 0 || pixelY >= currentPart.height) {
        return;
      }

      ctx.fillStyle = color;
      ctx.fillRect(pixelX * zoom, pixelY * zoom, zoom, zoom);

      // Update layer data
      const imageData = getScaledImageData();
      layers[currentLayerIndex].data = imageData;
    }

    function floodFill(startX, startY, fillColor) {
      const pixelX = Math.floor(startX / zoom);
      const pixelY = Math.floor(startY / zoom);

      if (pixelX < 0 || pixelX >= currentPart.width || pixelY < 0 || pixelY >= currentPart.height) {
        return;
      }

      const imageData = getScaledImageData();
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;

      const targetColor = getPixelColor(data, pixelX, pixelY, width);
      const fillRgba = hexToRgba(fillColor);

      if (colorsMatch(targetColor, fillRgba)) return;

      const stack = [[pixelX, pixelY]];
      const visited = new Set();

      while (stack.length > 0) {
        const [x, y] = stack.pop();
        const key = `${x},${y}`;

        if (visited.has(key)) continue;
        if (x < 0 || x >= width || y < 0 || y >= height) continue;

        const currentColor = getPixelColor(data, x, y, width);
        if (!colorsMatch(currentColor, targetColor)) continue;

        visited.add(key);
        setPixelColor(data, x, y, width, fillRgba);

        stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
      }

      layers[currentLayerIndex].data = imageData;

      // Redraw canvas
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = currentPart.width;
      tempCanvas.height = currentPart.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.putImageData(imageData, 0, 0);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);

      render();
    }

    function getPixelColor(data, x, y, width) {
      const index = (y * width + x) * 4;
      return [data[index], data[index + 1], data[index + 2], data[index + 3]];
    }

    function setPixelColor(data, x, y, width, rgba) {
      const index = (y * width + x) * 4;
      data[index] = rgba[0];
      data[index + 1] = rgba[1];
      data[index + 2] = rgba[2];
      data[index + 3] = rgba[3];
    }

    function hexToRgba(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return [r, g, b, 255];
    }

    function colorsMatch(c1, c2) {
      return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
    }

    function getColorAtPosition(x, y) {
      const pixelX = Math.floor(x / zoom);
      const pixelY = Math.floor(y / zoom);

      if (pixelX < 0 || pixelX >= currentPart.width || pixelY < 0 || pixelY >= currentPart.height) {
        return null;
      }

      const imageData = getScaledImageData();
      const rgba = getPixelColor(imageData.data, pixelX, pixelY, imageData.width);

      if (rgba[3] === 0) return null;

      return rgbaToHex(rgba);
    }

    function rgbaToHex(rgba) {
      const r = rgba[0].toString(16).padStart(2, '0');
      const g = rgba[1].toString(16).padStart(2, '0');
      const b = rgba[2].toString(16).padStart(2, '0');
      return `#${r}${g}${b}`;
    }

    function setupEventListeners() {
      // Tool buttons
      document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTool = btn.dataset.tool;
          document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Canvas drawing
      canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        saveHistory();

        if (currentTool === 'pen') {
          drawPixel(x, y, currentColor);
        } else if (currentTool === 'eraser') {
          drawPixel(x, y, 'rgba(0,0,0,0)');
        } else if (currentTool === 'fill') {
          floodFill(x, y, currentColor);
        } else if (currentTool === 'picker') {
          const color = getColorAtPosition(x, y);
          if (color) {
            currentColor = color;
            document.getElementById('customColorPicker').value = color;
            updateColorSelection();
          }
        }

        lastX = x;
        lastY = y;
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (currentTool === 'pen') {
          drawLine(lastX, lastY, x, y, currentColor);
        } else if (currentTool === 'eraser') {
          drawLine(lastX, lastY, x, y, 'rgba(0,0,0,0)');
        }

        lastX = x;
        lastY = y;
      });

      canvas.addEventListener('mouseup', () => {
        isDrawing = false;
      });

      canvas.addEventListener('mouseleave', () => {
        isDrawing = false;
      });

      // Color picker
      document.getElementById('customColorPicker').addEventListener('input', (e) => {
        currentColor = e.target.value;
        updateColorSelection();
      });

      // Zoom slider
      document.getElementById('zoomSlider').addEventListener('input', (e) => {
        zoom = parseInt(e.target.value);
        document.getElementById('zoomValue').textContent = zoom + 'x';
        if (currentPart) {
          canvas.width = currentPart.width * zoom;
          canvas.height = currentPart.height * zoom;
          render();
        }
      });

      // Grid toggle
      document.getElementById('gridToggle').addEventListener('change', (e) => {
        showGrid = e.target.checked;
        render();
      });

      // Clear button
      document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm('确定要清空画布吗？')) {
          saveHistory();
          layers[currentLayerIndex].data = createEmptyImageData();
          render();
        }
      });

      // Flip buttons
      document.getElementById('flipHBtn').addEventListener('click', () => {
        saveHistory();
        flipHorizontal();
      });

      document.getElementById('flipVBtn').addEventListener('click', () => {
        saveHistory();
        flipVertical();
      });

      // Undo/Redo
      document.getElementById('undoBtn').addEventListener('click', undo);
      document.getElementById('redoBtn').addEventListener('click', redo);

      // Add layer
      document.getElementById('addLayerBtn').addEventListener('click', () => {
        layers.push({
          name: `Layer ${layers.length + 1}`,
          data: createEmptyImageData(),
          visible: true
        });
        currentLayerIndex = layers.length - 1;
        renderLayerList();
        render();
      });

      // Export
      document.getElementById('exportPNGBtn').addEventListener('click', exportCurrentPart);
      document.getElementById('exportAllBtn').addEventListener('click', () => {
        alert('批量导出功能需要 JSZip 库支持，请在实际项目中引入。\nBatch export requires JSZip library.');
      });

      // Import
      document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              saveHistory();
              importImage(img);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          undo();
        } else if (e.key === 'y' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          redo();
        } else if (e.key === 'g') {
          e.preventDefault();
          showGrid = !showGrid;
          document.getElementById('gridToggle').checked = showGrid;
          render();
        } else if (e.key === '1') {
          currentTool = 'pen';
          document.querySelector('[data-tool="pen"]').click();
        } else if (e.key === '2') {
          currentTool = 'eraser';
          document.querySelector('[data-tool="eraser"]').click();
        } else if (e.key === '3') {
          currentTool = 'fill';
          document.querySelector('[data-tool="fill"]').click();
        } else if (e.key === '4') {
          currentTool = 'picker';
          document.querySelector('[data-tool="picker"]').click();
        }
      });
    }

    function drawLine(x1, y1, x2, y2, color) {
      const dx = Math.abs(x2 - x1);
      const dy = Math.abs(y2 - y1);
      const sx = x1 < x2 ? 1 : -1;
      const sy = y1 < y2 ? 1 : -1;
      let err = dx - dy;

      while (true) {
        drawPixel(x1, y1, color);

        if (Math.abs(x1 - x2) < zoom && Math.abs(y1 - y2) < zoom) break;

        const e2 = 2 * err;
        if (e2 > -dy) {
          err -= dy;
          x1 += sx * zoom;
        }
        if (e2 < dx) {
          err += dx;
          y1 += sy * zoom;
        }
      }
    }

    function flipHorizontal() {
      const imageData = getScaledImageData();
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width / 2; x++) {
          const i1 = (y * width + x) * 4;
          const i2 = (y * width + (width - 1 - x)) * 4;

          for (let c = 0; c < 4; c++) {
            const temp = data[i1 + c];
            data[i1 + c] = data[i2 + c];
            data[i2 + c] = temp;
          }
        }
      }

      layers[currentLayerIndex].data = imageData;
      render();
    }

    function flipVertical() {
      const imageData = getScaledImageData();
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;

      for (let y = 0; y < height / 2; y++) {
        for (let x = 0; x < width; x++) {
          const i1 = (y * width + x) * 4;
          const i2 = ((height - 1 - y) * width + x) * 4;

          for (let c = 0; c < 4; c++) {
            const temp = data[i1 + c];
            data[i1 + c] = data[i2 + c];
            data[i2 + c] = temp;
          }
        }
      }

      layers[currentLayerIndex].data = imageData;
      render();
    }

    function saveHistory() {
      history = history.slice(0, historyIndex + 1);
      history.push(JSON.parse(JSON.stringify(layers[currentLayerIndex].data)));
      historyIndex++;

      if (history.length > 50) {
        history.shift();
        historyIndex--;
      }
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        layers[currentLayerIndex].data = JSON.parse(JSON.stringify(history[historyIndex]));
        render();
      }
    }

    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        layers[currentLayerIndex].data = JSON.parse(JSON.stringify(history[historyIndex]));
        render();
      }
    }

    function importImage(img) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = currentPart.width;
      tempCanvas.height = currentPart.height;
      const tempCtx = tempCanvas.getContext('2d');

      tempCtx.drawImage(img, 0, 0, currentPart.width, currentPart.height);
      layers[currentLayerIndex].data = tempCtx.getImageData(0, 0, currentPart.width, currentPart.height);

      render();
    }

    function exportCurrentPart() {
      const imageData = getScaledImageData();
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = currentPart.width;
      exportCanvas.height = currentPart.height;
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.putImageData(imageData, 0, 0);

      exportCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentPart.id}_${currentPart.width}x${currentPart.height}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Initialize app
    init();
  </script>
</body>
</html>
