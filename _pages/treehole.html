---
layout: single
title: "何人斯"
permalink: /treehole/
author_profile: false
classes: wide
---

{% include base_path %}

<div class="treehole-shell" data-treehole-root data-treehole-lang="zh">
  <header class="treehole-hero">
    <div class="treehole-hero__copy">
      <p class="treehole-kicker" data-i18n="kicker">何人斯</p>
      <h1 data-i18n="heroTitle">究竟是什么人？在外面的声音</h1>
      <p class="treehole-lead" data-i18n="heroLead">只可能在外面。你的心地幽深莫测</p>
    </div>
    <button
      class="treehole-lang-toggle"
      type="button"
      data-treehole-lang-toggle
      aria-label="Switch language"
    >
      English
    </button>
  </header>

  <div class="treehole-grid">
    <form class="treehole-form" data-treehole-form autocomplete="off">
      <div class="treehole-section-heading">
        <strong data-i18n="formTitle">留下你的话</strong>
        <small data-i18n="formLead">公开留言会在审核后出现在右侧。秘密留言只凭四位密码查看。</small>
      </div>

      <div class="treehole-field-row">
        <label class="treehole-field">
          <span data-i18n="nameLabel">名字</span>
          <input
            data-treehole-nickname
            type="text"
            maxlength="32"
            autocomplete="nickname"
            placeholder="Anonymous"
          />
        </label>

        <label class="treehole-field">
          <span data-i18n="emailLabel">邮箱（可选）</span>
          <input
            data-treehole-email
            type="email"
            maxlength="254"
            autocomplete="email"
            placeholder="you@example.com"
          />
        </label>
      </div>

      <label class="treehole-field treehole-field--message">
        <span data-i18n="messageLabel">留言</span>
        <textarea
          data-treehole-content
          maxlength="100"
          rows="2"
          required
          placeholder="写在这里"
        ></textarea>
      </label>

      <div class="treehole-secret-options">
        <label class="treehole-secret-check">
          <input data-treehole-secret type="checkbox" autocomplete="off" />
          <span data-i18n="secretLabel">秘密</span>
        </label>

        <label class="treehole-field treehole-passcode-field" data-treehole-passcode-field hidden>
          <span data-i18n="passcodeLabel">四位数密码</span>
          <input
            data-treehole-passcode
            type="text"
            inputmode="numeric"
            maxlength="4"
            pattern="[0-9]{4}"
            autocomplete="one-time-code"
            placeholder="0000"
          />
        </label>
      </div>

      <label class="treehole-honeypot" aria-hidden="true">
        <span>Website</span>
        <input data-treehole-website type="text" tabindex="-1" autocomplete="off" />
      </label>

      <div class="treehole-form-footer">
        <span class="treehole-count" data-treehole-count>0 / 100</span>
        <button class="treehole-submit" type="submit" data-treehole-submit>投递</button>
      </div>

      <p class="treehole-status" data-treehole-status aria-live="polite"></p>
    </form>

    <div class="treehole-side">
      <section class="treehole-board" aria-label="树洞留言">
        <div class="treehole-board-header">
          <div>
            <h2 data-i18n="boardTitle">回声</h2>
            <p data-i18n="boardLead">审核后的公开留言会在这里慢慢浮上来。</p>
          </div>
          <button class="treehole-refresh" type="button" data-treehole-refresh aria-label="刷新留言">
            <span data-i18n="refresh">刷新</span>
          </button>
        </div>

        <div class="treehole-list" data-treehole-list>
          <p class="treehole-empty" data-i18n="loading">正在听...</p>
        </div>
      </section>

      <section class="treehole-secret-reader" aria-label="查看秘密回复">
        <div class="treehole-board-header">
          <div>
            <h2 data-i18n="secretReaderTitle">查看秘密回复</h2>
            <p data-i18n="secretReaderLead">输入四位数密码。</p>
          </div>
        </div>

        <form class="treehole-secret-lookup-form" data-treehole-secret-lookup-form>
          <label class="treehole-field">
            <span data-i18n="secretLookupLabel">四位数密码</span>
            <input
              data-treehole-lookup-passcode
              type="text"
              inputmode="numeric"
              maxlength="4"
              pattern="[0-9]{4}"
              autocomplete="one-time-code"
              placeholder="0000"
            />
          </label>
          <button class="treehole-refresh treehole-secret-lookup-submit" type="submit" data-treehole-secret-lookup-submit>
            <span data-i18n="secretLookupSubmit">查看</span>
          </button>
        </form>

        <p class="treehole-status treehole-secret-status" data-treehole-secret-status aria-live="polite"></p>
        <div class="treehole-secret-results" data-treehole-secret-results></div>
      </section>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/treehole.js' | relative_url }}" defer></script>
